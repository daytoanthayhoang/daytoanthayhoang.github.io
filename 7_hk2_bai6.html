<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn tập Toán 7 HK2 - Sinh Đề Toán Thực Tế Hình Học</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <script type="text/javascript" charset="UTF-8" src="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraph.css" />

    <script>
        window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']], processEscapes: true }, svg: { fontCache: 'global' } };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');
        body { font-family: 'Nunito', sans-serif; background-color: #f0fdfa; background-image: radial-gradient(#ccfbf1 1px, transparent 1px); background-size: 20px 20px; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 10px 25px -5px rgba(17, 94, 89, 0.1); }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #14b8a6; border-radius: 4px; }
        .jxgbox { border-radius: 0.5rem; background-color: #ffffff; border: 2px solid #64748b; }
        .JXGtext { font-family: 'Nunito', sans-serif !important; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden text-slate-800">

    <header class="bg-teal-600 text-white shadow-lg z-10 flex-shrink-0">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-earth-americas text-2xl"></i>
                <h1 class="text-xl font-bold uppercase tracking-wide">DAYTOANTHAYHOANG - Ôn Tập Cuối Kỳ II</h1>
            </div>
            <div class="flex items-center gap-3">
                <div class="text-sm font-semibold bg-teal-800 px-4 py-1.5 rounded-full flex items-center gap-2">
                    <i class="fa-solid fa-satellite-dish"></i> Bài 6: Toán Thực Tế Hình Học
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 flex gap-4 overflow-hidden">
        
        <div class="w-5/12 flex flex-col gap-4 h-full">
            <div class="glass-panel rounded-2xl p-5 shadow-sm flex-shrink-0">
                <h2 class="text-lg font-bold text-teal-800 border-b-2 border-teal-100 pb-2 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles text-teal-600"></i> Bảng Điều Khiển Sinh Đề
                </h2>
                
                <div class="flex flex-col gap-3 mb-3">
                    <select id="chonDang" class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-base rounded-lg focus:ring-teal-500 focus:border-teal-500 block p-2.5 font-semibold">
                        <option value="trung_truc">Dạng 1: Đường Trung Trực (Cách đều đỉnh)</option>
                        <option value="phan_giac">Dạng 2: Đường Phân Giác (Cách đều cạnh/góc)</option>
                        <option value="trung_tuyen">Dạng 3: Đường Trung Tuyến (Trọng tâm/Tỉ lệ)</option>
                        <option value="duong_cao">Dạng 4: Đường Cao (Ngắn nhất/Vuông góc)</option>
                    </select>

                    <div id="config-panel" class="w-full"></div>
                    
                    <div class="flex gap-2">
                        <button id="btnGenType" class="w-1/2 bg-teal-500 hover:bg-teal-600 text-white font-bold py-2.5 px-3 rounded-lg transition-colors shadow-sm text-sm">
                            <i class="fa-solid fa-arrows-rotate"></i> Sinh đề Dạng này
                        </button>
                        <button id="btnRandomAll" class="w-1/2 bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-2.5 px-3 rounded-lg transition-colors shadow-sm text-sm">
                            <i class="fa-solid fa-dice"></i> Ngẫu nhiên TẤT CẢ
                        </button>
                    </div>
                </div>

                <div class="mt-4">
                    <button id="btnStep" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-2.5 px-4 rounded-xl transition-colors shadow-sm flex items-center justify-center gap-2">
                        <i class="fa-solid fa-person-chalkboard"></i> Phân tích Mô hình & Xem gợi ý
                    </button>
                </div>
            </div>

            <div class="glass-panel rounded-2xl p-5 shadow-sm flex-1 flex flex-col relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-teal-400 to-emerald-500"></div>
                <div class="flex justify-between items-center border-b-2 border-slate-100 pb-2 mb-4">
                    <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-clipboard-question text-teal-600"></i> Nội dung thực tế
                    </h2>
                </div>
                <div id="problem-content" class="flex-1 overflow-y-auto custom-scrollbar text-lg pr-2 text-justify">
                </div>
            </div>
        </div>

        <div class="w-7/12 glass-panel rounded-2xl shadow-sm flex flex-col relative overflow-hidden bg-slate-800 border-slate-700 p-2">
            <div id="box" class="jxgbox w-full h-[55%] mb-2 shadow-inner"></div>
            <div class="bg-slate-900 text-slate-200 p-2 rounded-t-lg flex justify-between items-center border-b border-slate-700 flex-shrink-0">
                <h2 class="font-bold flex items-center gap-2 text-sm">
                    <i class="fa-solid fa-microscope text-amber-400"></i> Giải mã Toán Học & Hướng dẫn trình bày
                </h2>
            </div>
            <div id="solution-board" class="flex-1 overflow-y-auto p-4 font-sans text-slate-100 custom-scrollbar bg-slate-900 rounded-b-lg text-base leading-relaxed space-y-3">
            </div>
        </div>

    </main>

    <script type="module" src="7_hk2_bai6/main.js"></script>
</body>
</html>
