<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 800 410" width="800" height="410">
<title id="title">Đế nhìn từ trên</title><desc id="desc">Mặt khe và mặt màn cách nhau 60 cm. Mặt phẳng vật di chuyển dọc đế trong phạm vi 20 đến 40 cm.</desc>
<rect x="1" y="1" width="798" height="408" rx="16" fill="#fbfaf6" stroke="#d5dbd4" stroke-width="2"/>
<style>text{font-family:Arial,sans-serif;fill:#203b3d} .h{font-size:24px;font-weight:bold}.t{font-size:18px}.s{font-size:16px}.b{font-weight:bold}.teal{fill:#086e66}.amber{fill:#8d4c0c}</style>
<text x="35" y="43" class="h" text-anchor="start">Đế và các vị trí đặt</text>
<text x="765" y="43" class="s" text-anchor="end">Nhìn từ trên</text>
<rect x="76" y="155" width="600" height="120" rx="3" fill="#f4dfad" stroke="#a47f41" stroke-width="2"/>
<line x1="140" y1="215" x2="620" y2="215" stroke="#8b7449" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="300" y="178" width="160" height="17" rx="4" fill="#90cec0"/>
<text x="380" y="170" class="s teal b" text-anchor="middle">Giá kẹp trượt 20–40 cm</text>
<line x1="140" y1="151" x2="140" y2="276" stroke="#b56516" stroke-width="6" />
<line x1="620" y1="95" x2="620" y2="335" stroke="#0f766e" stroke-width="6" />
<line x1="140" y1="112" x2="620" y2="112" stroke="#273f56" stroke-width="1.8" />
<line x1="140" y1="105" x2="140" y2="120" stroke="#44535c" stroke-width="2" />
<line x1="620" y1="105" x2="620" y2="120" stroke="#44535c" stroke-width="2" />
<text x="380" y="102" class="t b" text-anchor="middle">L = 60 cm</text>
<text x="140" y="138" class="s amber b" text-anchor="middle">Mặt khe</text>
<text x="638" y="143" class="s teal b" text-anchor="start">Mặt màn</text>
<line x1="140" y1="220" x2="140" y2="232" stroke="#715f43" stroke-width="2" /><text x="140" y="254" class="s" text-anchor="middle">0</text>
<line x1="220" y1="220" x2="220" y2="232" stroke="#715f43" stroke-width="2" /><text x="220" y="254" class="s" text-anchor="middle">10</text>
<line x1="300" y1="220" x2="300" y2="232" stroke="#715f43" stroke-width="2" /><text x="300" y="254" class="s" text-anchor="middle">20</text>
<line x1="380" y1="220" x2="380" y2="232" stroke="#715f43" stroke-width="2" /><text x="380" y="254" class="s" text-anchor="middle">30</text>
<line x1="460" y1="220" x2="460" y2="232" stroke="#715f43" stroke-width="2" /><text x="460" y="254" class="s" text-anchor="middle">40</text>
<line x1="540" y1="220" x2="540" y2="232" stroke="#715f43" stroke-width="2" /><text x="540" y="254" class="s" text-anchor="middle">50</text>
<line x1="620" y1="220" x2="620" y2="232" stroke="#715f43" stroke-width="2" /><text x="620" y="254" class="s" text-anchor="middle">60</text>
<line x1="76" y1="304" x2="676" y2="304" stroke="#44535c" stroke-width="1.5" />
<line x1="76" y1="296" x2="76" y2="312" stroke="#44535c" stroke-width="2" />
<line x1="676" y1="296" x2="676" y2="312" stroke="#44535c" stroke-width="2" />
<text x="376" y="329" class="t" text-anchor="middle">Đế 75 × 15 cm</text>
<text x="35" y="378" class="t" text-anchor="start">Đo d từ mặt khe tới mặt phẳng thẻ. Đo L từ mặt khe tới mặt màn.</text></svg>