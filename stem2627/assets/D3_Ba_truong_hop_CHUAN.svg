<rect x="539" y="644" width="130" height="42" rx="6" fill="#6d777d" fill-opacity=".92"/>

<rect x="798" y="174" width="352" height="562" rx="21" fill="#fffdfa" stroke="#cbded9" stroke-width="2"/>
<text x="974" y="226" text-anchor="middle" style="font-size:30px;font-weight:750;fill:#815b19">CHƯA RÕ</text>
<text x="974" y="266" class="tiny" text-anchor="middle">Khoảng trên vắt qua vạch</text>
<rect x="882" y="294" width="190" height="400" fill="#fff" stroke="#b5c8c7" stroke-width="2"/>
