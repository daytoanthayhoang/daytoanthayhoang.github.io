<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn tập Toán 7 HK2 - Bài 5 (Hình học Tổng hợp)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <script type="text/javascript" charset="UTF-8" src="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraphcore.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraph.css" />

    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']], processEscapes: true },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0fdfa; 
            background-image: radial-gradient(#ccfbf1 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 25px -5px rgba(17, 94, 89, 0.1);
        }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #14b8a6; border-radius: 4px; }
        
        .jxgbox { border-radius: 0.5rem; background-color: #ffffff; border: 2px solid #64748b; }
        .JXGtext { font-family: 'Nunito', sans-serif !important; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden text-slate-800">

    <header class="bg-teal-600 text-white shadow-lg z-10 flex-shrink-0">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-shapes text-2xl"></i>
                <h1 class="text-xl font-bold uppercase tracking-wide">DAYTOANTHAYHOANG - Ôn Tập Cuối Kỳ II (Toán 7)</h1>
            </div>
            <div class="flex items-center gap-3">
                <div class="text-sm font-semibold bg-teal-800 px-4 py-1.5 rounded-full flex items-center gap-2">
                    <i class="fa-solid fa-compass"></i> Bài 5: Hình Học Tổng Hợp
                </div>
            </div>O
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 flex gap-4 overflow-hidden">
        
        <div class="w-5/12 flex flex-col gap-4 h-full">
            <div class="glass-panel rounded-2xl p-5 shadow-sm flex-shrink-0">
                <h2 class="text-lg font-bold text-teal-800 border-b-2 border-teal-100 pb-2 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-teal-600"></i> Danh sách Đề ôn tập
                </h2>
                
				<select id="chonDe" class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-base rounded-lg focus:ring-teal-500 focus:border-teal-500 block p-2.5 font-semibold">
                    <optgroup label="Đề Ôn Tập Căn Bản">
                        <option value="0">Đề 0: Các dạng Hình học cốt lõi</option>
                    </optgroup>
                    <optgroup label="Nhóm 1: Đề Huyện Hóc Môn">
                        <option value="1">Đề 1: Chính thức 2024 - 2025</option>
                        <option value="2">Đề 2: Chính thức 2023 - 2024</option>
                        <option value="3">Đề 3: Tham khảo HK2 2022 - 2023</option>
                        <option value="4">Đề 4: Minh họa 2024 - 2025</option>
                    </optgroup>
                </select>

                <div class="mt-4">
                    <button id="btnStep" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-2.5 px-4 rounded-xl transition-colors shadow-sm flex items-center justify-center gap-2">
                        <i class="fa-solid fa-pencil"></i> Vẽ bước tiếp / Xem gợi ý
                    </button>
                </div>
            </div>

            <div class="glass-panel rounded-2xl p-5 shadow-sm flex-1 flex flex-col relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-teal-400 to-emerald-500"></div>
                <div class="flex justify-between items-center border-b-2 border-slate-100 pb-2 mb-4">
                    <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-book-open text-teal-600"></i> Đề Bài
                    </h2>
                </div>
                <div id="problem-content" class="flex-1 overflow-y-auto custom-scrollbar text-lg pr-2 text-justify">
                </div>
            </div>
        </div>

        <div class="w-7/12 glass-panel rounded-2xl shadow-sm flex flex-col relative overflow-hidden bg-slate-800 border-slate-700 p-2">
            
            <div class="flex flex-wrap gap-2 mb-2 bg-slate-900 p-2 rounded-lg justify-center border border-slate-600 shadow-sm">
                <button id="btnFlipX" class="px-3 py-1 bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold rounded text-sm transition-colors">
                    <i class="fa-solid fa-arrows-left-right text-teal-400 mr-1"></i> Lật ngang
                </button>
                <button id="btnFlipY" class="px-3 py-1 bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold rounded text-sm transition-colors">
                    <i class="fa-solid fa-arrows-up-down text-teal-400 mr-1"></i> Lật dọc
                </button>
                <div class="w-px bg-slate-600 mx-1"></div>
                <button id="btnRot30" class="px-3 py-1 bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold rounded text-sm transition-colors">
                    <i class="fa-solid fa-rotate-right text-amber-400 mr-1"></i> 30°
                </button>
                <button id="btnRot45" class="px-3 py-1 bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold rounded text-sm transition-colors">
                    <i class="fa-solid fa-rotate-right text-amber-400 mr-1"></i> 45°
                </button>
                <button id="btnRot90" class="px-3 py-1 bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold rounded text-sm transition-colors">
                    <i class="fa-solid fa-rotate-right text-amber-400 mr-1"></i> 90°
                </button>
            </div>

            <div id="box" class="jxgbox w-full h-[50%] mb-2 shadow-inner"></div>

            <div class="bg-slate-900 text-slate-200 p-2 rounded-t-lg flex justify-between items-center border-b border-slate-700 flex-shrink-0">
                <h2 class="font-bold flex items-center gap-2 text-sm">
                    <i class="fa-solid fa-lightbulb text-amber-400"></i> Phân tích & Gợi ý giải theo Barem
                </h2>
            </div>

            <div id="solution-board" class="flex-1 overflow-y-auto p-4 font-sans text-slate-100 custom-scrollbar bg-slate-900 rounded-b-lg text-base leading-relaxed space-y-3">
            </div>
        </div>

    </main>

    <script type="module" src="7_hk2_bai5/main.js"></script>
</body>
</html>
