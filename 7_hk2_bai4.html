    <script>
        // --- 1. CORE MATH ENGINE (Phân số & Đa thức) ---
        function gcd(a, b) {
            a = Math.abs(a); b = Math.abs(b);
            while (b) { let temp = b; b = a % b; a = temp; }
            return a;
        }

        class Frac {
            constructor(n, d = 1) {
                if (d === 0) throw new Error("Mẫu số không thể bằng 0");
                if (d < 0) { n = -n; d = -d; }
                let g = gcd(n, d);
                this.n = n / g;
                this.d = d / g;
            }
            add(f) { return new Frac(this.n * f.d + f.n * this.d, this.d * f.d); }
            sub(f) { return new Frac(this.n * f.d - f.n * this.d, this.d * f.d); }
            mul(f) { return new Frac(this.n * f.n, this.d * f.d); }
            div(f) { return new Frac(this.n * f.d, this.d * f.n); }
            isZero() { return this.n === 0; }
            isPositive() { return this.n > 0; }
            isNegative() { return this.n < 0; }
            abs() { return new Frac(Math.abs(this.n), this.d); }
            
            toLatex(showPlus = false, isCoeff = false) {
                if (this.isZero()) return "0";
                let sign = this.isNegative() ? "-" : (showPlus ? "+" : "");
                let absN = Math.abs(this.n);
                
                if (this.d === 1) {
                    if (isCoeff && absN === 1) return sign === "-" ? "-" : (showPlus ? "+" : "");
                    return sign + absN;
                }
                return sign + "\\frac{" + absN + "}{" + this.d + "}";
            }
            
            toRawLatex() {
                if (this.d === 1) return this.n < 0 ? `(${this.n})` : `${this.n}`;
                return this.n < 0 ? `\\left(-\\frac{${Math.abs(this.n)}}{${this.d}}\\right)` : `\\frac{${this.n}}{${this.d}}`;
            }
        }

        class Term {
            constructor(c_n, c_d, deg) {
                this.coeff = new Frac(c_n, c_d);
                this.deg = deg;
            }
            toLatex(isFirst = false) {
                if (this.coeff.isZero()) return "";
                let cStr = this.coeff.toLatex(!isFirst, this.deg > 0);
                if (cStr === "+" && this.deg > 0) cStr = "+ ";
                else if (cStr === "-" && this.deg > 0) cStr = "- ";
                else if (cStr !== "" && this.deg > 0 && !cStr.endsWith(" ")) cStr += "";

                if (this.deg === 0) return this.coeff.toLatex(!isFirst, false);
                if (this.deg === 1) return cStr + "x";
                return cStr + "x^" + this.deg;
            }
            toRawLatex() {
                let cStr = this.coeff.toRawLatex();
                if (this.deg === 0) return cStr;
                if (this.deg === 1) return (cStr==='1'||cStr==='(1)')?'x':(cStr==='-1'||cStr==='(-1)')?'(-x)': cStr + "x";
                return (cStr==='1'||cStr==='(1)')?`x^{${this.deg}}`:(cStr==='-1'||cStr==='(-1)')?`(-x^{${this.deg}})`: cStr + "x^" + this.deg;
            }
        }

        class Poly {
            constructor(terms = []) {
                this.terms = terms.filter(t => !t.coeff.isZero());
            }
            toLatex() {
                if (this.terms.length === 0) return "0";
                let sorted = [...this.terms].sort((a, b) => b.deg - a.deg);
                let latex = "";
                for (let i = 0; i < sorted.length; i++) {
                    latex += sorted[i].toLatex(i === 0) + " ";
                }
                return latex.trim();
            }
        }

        function t(n, d, deg) { return new Term(n, d, deg); }

                { id: "D11", src: "Đề 11 - THCS Nguyễn An Khương", a: { p1: [t(2,1,1), t(-3,1,0)], p2: [t(1,1,2), t(2,1,1), t(-7,1,0)] }, b: { divd: [t(1,6,3), t(-2,3,2)], divs: t(-1,3,1) } },
                { id: "D12", src: "Đề 12 - THCS Nguyễn Văn Bứa", a: { p1: [t(2,1,1), t(-3,1,0)], p2: [t(5,1,1), t(-4,1,0)] }, b: { divd: [t(1,2,3), t(-1,6,2), t(3,1,1)], divs: t(3,1,1) } },
                { id: "D13", src: "Đề 13 - THCS Tam Đông 1", a: { p1: [t(3,1,1), t(2,1,0)], p2: [t(5,1,1), t(-4,1,0)] }, b: { divd: [t(-1,2,3), t(1,4,2), t(-5,1,1)], divs: t(-1,10,1) } },
                { id: "D14", src: "Đề 14 - THCS Tre Việt", a: { p1: [t(2,1,1), t(-9,1,0)], p2: [t(1,1,1), t(2,1,0)] }, b: { divd: [t(-1,3,6), t(1,9,5), t(-1,9,4)], divs: t(-3,1,2) } },
                { id: "D15", src: "Đề 15 - THCS Đông Thạnh", a: { p1: [t(1,1,1), t(-3,1,0)], p2: [t(2,1,1), t(-5,1,0)] }, b: { divd: [t(-2,5,3), t(-5,2,2), t(5,1,1)], divs: t(-5,2,1) } },
                { id: "D16", src: "Đề 16 - THCS Nguyễn Hồng Đào", a: { p1: [t(1,1,1), t(-1,1,0)], p2: [t(2,1,2), t(-3,1,1), t(1,1,0)] }, b: { divd: [t(-1,2,5), t(1,4,2), t(2,1,1)], divs: t(-1,2,1) } },
                { id: "D17", src: "Đề 17 - THCS Xuân Thới Thượng", a: { p1: [t(1,1,1), t(-5,1,0)], p2: [t(3,1,1), t(2,1,0)] }, b: { divd: [t(18,1,4), t(-9,1,2), t(15,1,1)], divs: t(-3,2,1) } },
            ]
        };

        // --- 3. GENERATOR ENGINE ---
        function randInt(min, max, excludeZero = true) {
            let val;
            do { val = Math.floor(Math.random() * (max - min + 1)) + min; } 
            while (excludeZero && val === 0);
            return val;
        }
        function randChoice(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

        function mutateTerm(term, isFraction) {
            let n = randInt(-6, 6);
            let d = 1;
            if (isFraction || Math.random() < 0.3) {
                d = randChoice([2, 3, 4, 5]);
            }
            return t(n, d, term.deg);
        }

        function mutateProblem(orig, sectionName) {
            let isFracB = orig.b.divs.coeff.d !== 1 || orig.b.divd.some(t => t.coeff.d !== 1);
            
            let p1 = orig.a.p1.map(t => mutateTerm(t, false));
            let p2 = orig.a.p2.map(t => mutateTerm(t, false));
            
            let divd = orig.b.divd.map(t => mutateTerm(t, isFracB));
            let divs = mutateTerm(orig.b.divs, isFracB);

            return {
                src: `${orig.src} (Biến thể số liệu)`,
                isOriginal: false,
                a: { p1, p2 },
                b: { divd, divs }
            };
        }

        function genAdvanced() {
            let r = Math.random();
            let p1, p2, divd, divs;
            
            if (r < 0.5) {
                p1 = [t(randInt(-5,5), randChoice([1,2,3]), 1), t(randInt(-8,8), 1, 0)];
                p2 = [t(randInt(-5,5), randChoice([1,2,3]), 1), t(randInt(-8,8), 1, 0)];
            } else {
                p1 = [t(randInt(-4,4), 1, 1), t(randInt(-5,5), 1, 0)];
                p2 = [t(randInt(-3,3), 1, 2), t(randInt(-5,5), 1, 1), t(randInt(-6,6), 1, 0)];
            }

            let degDivs = randChoice([1, 2, 3]);
            divs = t(randInt(-5,5), randChoice([1,2,3,4]), degDivs);
            
            let numTerms = randInt(3, 4);
            divd = [];
            let currentDeg = degDivs + randInt(1, 3);
            for(let i=0; i<numTerms; i++) {
                divd.push(t(randInt(-9,9), randChoice([1,2,3,4,5]), currentDeg));
                currentDeg++;
            }
            divd.reverse();

            return {
                src: "Phần 3: Chế độ Phát triển nâng cao (Đầu lâu) 💀",
                isOriginal: false,
                a: { p1, p2 },
                b: { divd, divs }
            };
        }

        // --- 4. APP STATE & LOGIC ---
        let currentProblem = null;
        let solutionSteps = { a: [], b: [] }; // Mảng lưu objects { latex, note }
        let currentStepA = 0;
        let currentStepB = 0;
        
        let streak = 0, correctTotal = 0, wrongTotal = 0;

        function handleCheckboxChange() {
            const p1 = document.getElementById('part1').checked;
            const p2 = document.getElementById('part2').checked;
            const p3 = document.getElementById('part3').checked;
            
            if (!p1 && !p2 && !p3) {
                document.getElementById('part1').checked = true;
            }
            generateProblem();
        }

        function generateProblem() {
            const p1 = document.getElementById('part1').checked;
            const p2 = document.getElementById('part2').checked;
            const p3 = document.getElementById('part3').checked;

            let pools = [];
            if (p1) pools.push({ type: 'part1', data: DB.part1 });
            if (p2) pools.push({ type: 'part2', data: DB.part2 });

            let prob = null;

            if (p3) {
                let r = Math.random();
                if (r < 0.5 || pools.length === 0) {
                    prob = genAdvanced();
                } else {
                    let pool = randChoice(pools);
                    let orig = randChoice(pool.data);
                    prob = Math.random() < 0.5 ? orig : mutateProblem(orig, pool.type);
                }
            } else {
                let pool = randChoice(pools);
                let orig = randChoice(pool.data);
                prob = Math.random() < 0.5 ? orig : mutateProblem(orig, pool.type);
            }

            currentProblem = prob;
            renderProblem();
            prepareSolutionSteps();
            resetBoard();
            updateStatsUI();
        }

        function renderProblem() {
            const container = document.getElementById('problem-content');
            const sourceLabel = document.getElementById('problem-source');
            
            let polyA1 = new Poly(currentProblem.a.p1).toLatex();
            let polyA2 = new Poly(currentProblem.a.p2).toLatex();
            let polyB1 = new Poly(currentProblem.b.divd).toLatex();
            let polyB2 = currentProblem.b.divs.toLatex();

            let latexA = `a) \\; (${polyA1})(${polyA2})`;
            let latexB = `b) \\; (${polyB1}) : ` + (currentProblem.b.divs.coeff.d !== 1 || currentProblem.b.divs.coeff.n < 0 ? `\\left(${polyB2}\\right)` : `(${polyB2})`);

            container.innerHTML = `
                <div class="mb-4"><strong>Thực hiện phép tính:</strong></div>
                <div class="pl-4 space-y-4">
                    <div>$${latexA}$</div>
                    <div>$${latexB}$</div>
                </div>
            `;
            
            sourceLabel.innerHTML = currentProblem.src;
            if(currentProblem.isOriginal === false && !currentProblem.src.includes('Đầu lâu')) {
                sourceLabel.className = "text-xs font-bold px-2.5 py-1 bg-amber-100 text-amber-700 rounded-md border border-amber-200";
            } else if (currentProblem.src.includes('Đầu lâu')) {
                sourceLabel.className = "text-xs font-bold px-2.5 py-1 bg-red-100 text-red-700 rounded-md border border-red-200";
            } else {
                sourceLabel.className = "text-xs font-bold px-2.5 py-1 bg-teal-100 text-teal-800 rounded-md border border-teal-200";
            }

            MathJax.typesetPromise();
        }

        // --- 5. LOGIC GIẢI TỪNG BƯỚC (BAREM + CHÚ THÍCH) ---
        function prepareSolutionSteps() {
            solutionSteps = { a: [], b: [] };
            
            // --- CÂU A: NHÂN ---
            let a_p1 = currentProblem.a.p1;
            let a_p2 = currentProblem.a.p2;
            
            let origA = `(${new Poly(a_p1).toLatex()})(${new Poly(a_p2).toLatex()})`;
            
            let expStrs = [];
            let expandedTerms = [];
            for (let t1 of a_p1) {
                for (let t2 of a_p2) {
                    let r1 = t1.toRawLatex();
                    let r2 = t2.toRawLatex();
                    expStrs.push(`${r1} \\cdot ${r2}`);
                    
                    let newC = t1.coeff.mul(t2.coeff);
                    let newDeg = t1.deg + t2.deg;
                    expandedTerms.push(t(newC.n, newC.d, newDeg));
                }
            }
            let step1Latex = expStrs.join(" + ").replace(/\+ -/g, "- ");

            let pExp = new Poly(expandedTerms);
            let step2Latex = pExp.toLatex();

            let groupedMap = {};
            for (let term of expandedTerms) {
                if (!groupedMap[term.deg]) groupedMap[term.deg] = new Frac(0);
                groupedMap[term.deg] = groupedMap[term.deg].add(term.coeff);
            }
            let finalTermsA = [];
            for (let deg in groupedMap) {
                if (!groupedMap[deg].isZero()) finalTermsA.push(t(groupedMap[deg].n, groupedMap[deg].d, parseInt(deg)));
            }
            let pFinalA = new Poly(finalTermsA);
            let step3Latex = pFinalA.toLatex();

            // Đẩy từng bước kèm ghi chú chi tiết
            solutionSteps.a.push({ latex: `\\text{a) } ${origA}`, note: "" });
            solutionSteps.a.push({ latex: `= ${step1Latex}`, note: "Nhân phân phối từng hạng tử của đa thức thứ nhất với từng hạng tử của đa thức thứ hai." });
            if (step1Latex !== step2Latex) {
                solutionSteps.a.push({ latex: `= ${step2Latex}`, note: "Thực hiện tính kết quả của các phép nhân (chú ý quy tắc dấu)." });
            }
            if (step2Latex !== step3Latex) {
                solutionSteps.a.push({ latex: `= ${step3Latex}`, note: "Thu gọn các hạng tử đồng dạng (cùng số mũ) để ra kết quả cuối cùng." });
            }


            // --- CÂU B: CHIA ---
            let b_divd = currentProblem.b.divd;
            let b_divs = currentProblem.b.divs;
            let divsLatex = b_divs.coeff.d !== 1 || b_divs.coeff.n < 0 ? `\\left(${b_divs.toLatex()}\\right)` : `(${b_divs.toLatex()})`;
            let origB = `\\text{b) } \\left(${new Poly(b_divd).toLatex()}\\right) : ${divsLatex}`;

            let divStrs = [];
            let resultTermsB = [];
            for (let t of b_divd) {
                let r1 = t.coeff.d !== 1 || t.coeff.n < 0 ? `\\left(${t.toLatex(true)}\\right)` : `(${t.toLatex(true)})`;
                divStrs.push(`${r1} : ${divsLatex}`);
                
                let newC = t.coeff.div(b_divs.coeff);
                let newDeg = t.deg - b_divs.deg;
                resultTermsB.push(new Term(newC.n, newC.d, newDeg));
            }
            let step1B = divStrs.join(" + ").replace(/\+ -/g, "- ");

            let pFinalB = new Poly(resultTermsB);
            let step2B = pFinalB.toLatex();

            solutionSteps.b.push({ latex: origB, note: "" });
            solutionSteps.b.push({ latex: `= ${step1B}`, note: "Lấy từng hạng tử của đa thức bị chia đem chia cho đơn thức." });
            solutionSteps.b.push({ latex: `= ${step2B}`, note: "Thực hiện phép chia (chia hệ số, trừ số mũ của biến) để ra kết quả." });
        }

        // --- 6. UI BOARD CONTROLS ---
        function resetBoard() {
            document.getElementById('solution-content-a').innerHTML = '';
            document.getElementById('solution-content-b').innerHTML = '';
            document.getElementById('solution-content-b').classList.add('hidden');
            
            document.getElementById('btn-step-a').classList.add('hidden');
            document.getElementById('btn-step-b').classList.add('hidden');
            
            currentStepA = 0;
            currentStepB = 0;
        }

        function startStepByStep() {
            resetBoard();
            document.getElementById('btn-step-a').classList.remove('hidden');
            document.getElementById('btn-step-a').innerHTML = 'Bắt đầu Câu A <i class="fa-solid fa-forward-step ml-1"></i>';
            showHintModal(
                `<div class="text-center mb-3">Hệ thống sẽ trình bày từng bước giải kèm theo <strong>lời giải thích chi tiết bên dưới</strong> mỗi công thức.</div>
                <hr class="my-2 border-amber-200">
                <strong>Bạn cần nhớ nhanh:</strong><br>
                <ul class="list-disc pl-5 mt-2 space-y-1">
                    <li><strong>Câu a (Nhân):</strong> Dấu cùng loại nhân nhau thành $(+)$, khác loại thành $(-)$. Khi nhân biến: $x^m \\cdot x^n = x^{m+n}$.</li>
                    <li><strong>Câu b (Chia):</strong> Khi chia biến: $x^m : x^n = x^{m-n}$.</li>
                </ul>`
            );
            
            streak++;
            correctTotal++;
            updateStatsUI();
        }

        function showNextStep(part) {
            let container = document.getElementById(`solution-content-${part}`);
            if (part === 'b' && currentStepB === 0) {
                container.classList.remove('hidden');
            }

            let stepData = solutionSteps[part];
            let currentStepIdx = part === 'a' ? currentStepA : currentStepB;

            if (currentStepIdx < stepData.length) {
                let stepObj = stepData[currentStepIdx];
                
                let div = document.createElement('div');
                div.className = 'step-item';
                
                // Render chú thích cực kỳ rõ ràng nằm ngay trên công thức
                let noteHtml = stepObj.note ? `<div class="text-sm text-teal-300 font-sans italic mb-1 flex items-start gap-1.5"><i class="fa-solid fa-arrow-turn-down mt-1"></i> <span>${stepObj.note}</span></div>` : "";
                
                div.innerHTML = `${noteHtml}<div class="overflow-x-auto overflow-y-hidden py-1">$$ ${stepObj.latex} $$</div>`;
                
                container.appendChild(div);
                MathJax.typesetPromise([div]).then(() => {
                    let board = document.getElementById('solution-board');
                    board.scrollTop = board.scrollHeight;
                });

                if (part === 'a') currentStepA++;
                else currentStepB++;

                let btn = document.getElementById(`btn-step-${part}`);
                btn.innerHTML = `Hiện bước ${currentStepIdx + 2} <i class="fa-solid fa-forward-step ml-1"></i>`;

                if (part === 'a' && currentStepA >= stepData.length) {
                    btn.classList.add('hidden');
                    let btnB = document.getElementById('btn-step-b');
                    btnB.classList.remove('hidden');
                    btnB.innerHTML = 'Bắt đầu Câu B <i class="fa-solid fa-forward-step ml-1"></i>';
                }
                
                if (part === 'b' && currentStepB >= stepData.length) {
                    document.getElementById('btn-step-b').classList.add('hidden');
                    setTimeout(() => {
                        showHintModal(`<strong>Hoàn thành xuất sắc! 🎉</strong><br>Bạn đã xem xong toàn bộ các bước trình bày chuẩn mực theo barem điểm cùng với những chú thích quan trọng. Hãy nhớ trình bày vào bài thi cẩn thận như thế này nhé!`);
                    }, 600);
                }
            }
        }

        // --- 7. UI UTILS & MODAL HINT ---
        function showHintModal(htmlContent) {
            const modal = document.getElementById('hint-modal');
            const box = document.getElementById('hint-content-box');
            document.getElementById('hint-text').innerHTML = htmlContent;
            
            modal.classList.remove('hidden');
            void modal.offsetWidth;
            modal.classList.remove('opacity-0');
            box.classList.remove('scale-95');
            box.classList.add('scale-100');

            MathJax.typesetPromise();
        }

        function closeHint() {
            const modal = document.getElementById('hint-modal');
            const box = document.getElementById('hint-content-box');
            modal.classList.add('opacity-0');
            box.classList.remove('scale-100');
            box.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        function updateStatsUI() {
            document.getElementById('streak').innerText = streak;
            document.getElementById('correct-total').innerText = correctTotal;
            document.getElementById('wrong-total').innerText = wrongTotal;
        }

        function initPdfButton() {
            console.log("PDF Printer ready");
        }

        window.onload = function() {
            initPdfButton();
            generateProblem();
        };

    </script>
</body>
